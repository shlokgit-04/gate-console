{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<div class="authwrap">
  <div class="authcard">
    <div class="brand"><span class="logo">🛡️</span> Gate Console</div>
    <h1>Sign in</h1>
    <p class="sub">Human review for agent tool calls. Accounts are per-reviewer.</p>
    <form id="loginform">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="8" autocomplete="current-password">
      <button class="btn wide" type="submit">Sign in</button>
      <p class="err" id="err" role="alert"></p>
      <p class="sub center">New here? <a href="/register">Create an account</a></p>
    </form>
  </div>
  <p class="footlink"><a href="/privacy">Privacy</a> · <a href="/about">About</a></p>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='auth.js') }}" data-mode="login"></script>{% endblock %}
